<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        try {
            var themeMatch = location.search.match(/theme=(dark|light)/);
            var requestedTheme = themeMatch ? themeMatch[1] : null;
            var cookieTheme = (document.cookie.match(/(?:^|; )vcodex_theme=(dark|light)/) || [])[1];
            document.documentElement.setAttribute('data-theme', requestedTheme || cookieTheme || 'dark');
        } catch (error) {}
    </script>
    <title>Entrar com Google — Valédria</title>
    <meta name="description" content="Entre na sua conta do Códice do Mundo de Valédria com o Google.">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/redesign.css">

    <link rel="stylesheet" href="assets/css/account.css?v=20261012">
    <link rel="icon" href="favicon.ico" sizes="any">
</head>
<body class="account-home">
    <a class="skip-link" href="#main">Saltar para o conteúdo</a>
    <main id="main" class="content account-page login-page">
        <header class="page-head">
            <span class="eyebrow">Seu lugar em Valédria</span>
            <h1>Entrar na sua conta</h1>
            <p>Acesse sua conta com o Google. O site continua aberto para visitantes.</p>
        </header>
        <section class="card" aria-labelledby="login-heading">
            <h2 id="login-heading">Continuar com Google</h2>

            <button id="google-login-button" class="google-login-button" type="button">
                    <svg viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.7c3.9-3.6 6-8.8 6-15Z"/>
                        <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.8l-6.7-5.1c-1.9 1.3-4.2 2.1-6.8 2.1-5.2 0-9.6-3.5-11.2-8.2H5.9v5.2A20 20 0 0 0 24 44Z"/>
                        <path fill="#FBBC05" d="M12.8 28a12 12 0 0 1 0-7.9v-5.2H5.9a20 20 0 0 0 0 18.3l6.9-5.2Z"/>
                        <path fill="#EA4335" d="M24 11.9c3 0 5.7 1 7.8 3.1l5.9-5.9A19.7 19.7 0 0 0 24 4 20 20 0 0 0 5.9 14.9l6.9 5.2c1.6-4.7 6-8.2 11.2-8.2Z"/>
                    </svg>
                    <span>Continuar com Google</span>
                </button>
            <p id="login-status" role="status" aria-live="polite"></p>
                <p>Para entrar com sessão segura do servidor, <a href="/auth/google">continue pelo OAuth web do Google</a>.</p>
        </section>
        <p>Voltar para <a href="index.html">a página inicial</a>.</p>
    </main>
    <script src="assets/js/login.js" defer></script>
</body>
</html>
