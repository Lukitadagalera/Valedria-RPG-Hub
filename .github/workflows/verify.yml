name: Verify site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/refresh-session-kits.py
      - run: git diff --exit-code -- assets/demo/studio.json
      - run: npm run build
      - run: npm test
      - run: node scripts/verify-commercial.cjs
